name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# windui 仅支持 Windows/macOS（Linux 无 PlatformTextEngine），故 CI 统一用 windows-latest。
# 集成冒烟（tests/mysql_integration_test.rs 等）需真实 MySQL/PG，请在本地手动运行。
jobs:
  lint:
    name: fmt + clippy + signal 检查
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: signal 误用静态检查（build_* 内禁建 signal）
        run: python scripts/check_signals.py

  test:
    name: 单元测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib --bins

  check-tests:
    name: tests 编译检查
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --tests
