[about]
sponsor = "If this toolbox has saved you time, buy the author a coffee ☕ Every bit of support keeps it getting better."
desc = "Open-source all-in-one server / website management toolkit — a native Windows desktop app built with Rust. Features include: 2FA Authenticator (TOTP keys & QR codes, compatible with Google Authenticator / Authy), random password generation & hashing (Argon2id / Bcrypt / PBKDF2, with SQL UPDATE output), database viewers (Turso / MySQL / PostgreSQL, with SQL query & CSV export), SFTP file manager & remote commands, S3 object storage browser, remote checks (connect / ping / SSL certificate / response body / SEO analysis / security scan), and URL QR code generation."
author = "Author: wujianqi"
built = "Built with Rust + windui."
license_title = "Open Source & License"
license = "Licensed under the MIT License (© 2026 wujianqi); full terms in the repository's LICENSE file. Some UI icons are styled after Lucide (MIT License, lucide.dev). Third-party library licenses: see Cargo.toml / Cargo.lock and each project's repository."
