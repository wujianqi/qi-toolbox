[profile.release]
opt-level = "z"     # 优化体积
lto = "fat"
codegen-units = 1  # 最大程度交叉优化，牺牲编译时间换更小体积
strip = true        # 剥离符号
panic = "abort"     # 减少 unwind 表

[package]
name = "qi-toolbox"
version = "0.2.2"
edition = "2021"
description = "奇兔宝 (Qi Toolbox) - 2FA验证码、随机密码、数据库浏览(Turso/MySQL/PG)、SFTP/SSH、S3浏览、远程检测"
license = "MIT"
repository = "https://github.com/wujianqi/qi-toolbox"

[[bin]]
name = "qi-toolbox"
path = "src/main.rs"

[lib]
name = "qi_toolbox"
path = "src/lib.rs"

# Windows 资源（build.rs 经 winresource 写入 exe）：文件名元数据 + logo.ico 图标
[package.metadata.winresource]
OriginalFilename = "qi-toolbox.exe"

[build-dependencies]
# 只在 Windows 目标上被 build.rs 调用（CARGO_CFG_TARGET_OS 判定）；crate 本体极小
winresource = "0.1"

[features]
default = []

[dependencies]
# Linux 支持（X11/Wayland 后端）尚未发版，暂用 main 分支；0.21+ 发布后切回 crates.io
windui = { git = "https://github.com/huanfeng/wind-ui-rust" }
bcrypt = "0.15"
argon2 = "0.5"
pbkdf2 = { version = "0.12", features = ["hmac"] }
sha2 = "0.10"
md5 = "0.8"
base64ct = { version = "1", features = ["alloc"] }
aes-gcm = "0.10"
getrandom = "0.2"
totp-rs = { version = "5", features = ["otpauth"] }
qrcode = "0.14"
turso = { version = "0.7.2", default-features = false, features = ["sync"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "io-util", "time", "sync"] }
russh = { version = "0.63", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2.4"
url = "2"
x509-parser = "0.16"
rusty-s3 = "0.4"
ureq = { version = "2", default-features = false, features = ["tls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "1"
# rfd 0.17 全仓唯一版本（windui 亦依赖 0.17）：出现 0.14 + 0.17 两个同名
# crate 会在 Linux 上报 E0464 multiple candidates for rmeta。
# 必须关 default（内含 wayland feature 会经 wayland-backend/client_system 拉进
# wayland-sys，编译期就要 pkg-config 找系统 libwayland）；Windows 后端无需 feature。
rfd = { version = "0.17", default-features = false }
png = "0.18"
mysql_async = "0.37.1"
tokio-postgres = "0.7.18"

[target.'cfg(unix)'.dependencies]
# Linux 文件对话框走 D-Bus xdg-portal（运行时门户，无门户时 rfd 回退 zenity）
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security_Cryptography", "Win32_System_Console", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
